
# TopoFR Loss Configuration (using AdaFace as base)
# Combining AdaFace with topological alignment

margin_loss_name: 'topofr'

# Base margin loss type
base_loss: 'adaface'

# AdaFace parameters (used if base_loss='adaface')
m: 0.4
h: 0.333
t_alpha: 0.01

# Topological loss weight (paper uses 0.1)
topo_weight: 0.1

# GUM (Gauss-Uniform Mixture) model for sample weighting
use_gum: true
temp: 1

# PartialFC
interclass_filtering_threshold: 0
